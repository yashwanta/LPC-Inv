name: Build and Package SimpleTech Books

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows-package:
    name: Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: cmd
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build and package
        shell: cmd
        run: scripts\package-windows.cmd

      - name: Read version
        id: version
        shell: cmd
        run: |
          set /p VERSION=<VERSION
          echo version=%VERSION%>>%GITHUB_OUTPUT%

      - name: Upload app zip
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTechBooks-${{ steps.version.outputs.version }}-windows-amd64
          path: dist/SimpleTechBooks-${{ steps.version.outputs.version }}-windows-amd64.zip
          if-no-files-found: error

      - name: Upload setup exe
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTechBooks-Setup-${{ steps.version.outputs.version }}
          path: dist/SimpleTechBooks-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
